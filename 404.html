<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Samiksha Patil</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Gowun+Batang:wght@700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --blush: #F8E5E5;
      --lilac: #CABEFF;
      --plum: #CE884A;
      --deep: #5D4241;
      --white: #FFFDFE;
      --soft-bg: #FCFAF6;
      --ink: #352221;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--soft-bg);
      background-image: 
        linear-gradient(to right, rgba(137, 126, 170, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(137, 126, 170, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--ink);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 440px;
      width: 90%;
      text-align: center;
      padding: 20px;
    }
    .error-window {
      background: var(--deep);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(93, 66, 65, 0.22);
      border: 2px solid rgba(206, 136, 74, 0.2);
      position: relative;
      margin-bottom: 24px;
    }
    .window-header {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot.red { background: #FF5F56; }
    .dot.yellow { background: #FFBD2E; }
    .dot.green { background: #27C93F; }
    .window-title {
      margin-left: auto;
      margin-right: auto;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.05em;
    }
    .window-body {
      padding: 40px 24px;
      color: white;
    }
    .error-code {
      font-family: 'Gowun Batang', serif;
      font-size: 80px;
      font-weight: 700;
      color: var(--blush);
      line-height: 1;
      margin: 0 0 10px;
    }
    .error-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 16px;
      color: var(--lilac);
    }
    .error-desc {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      margin: 0;
    }
    .btn-home {
      display: inline-block;
      background: linear-gradient(135deg, var(--plum) 0%, var(--deep) 100%);
      color: white;
      padding: 14px 28px;
      border-radius: 100px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(91, 55, 101, 0.25);
      transition: all 0.3s ease;
    }
    .btn-home:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(91, 55, 101, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-window">
      <div class="window-header">
        <div class="dots">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>
        <div class="window-title">404_error.sh</div>
      </div>
      <div class="window-body">
        <h1 class="error-code">404</h1>
        <div class="error-title">Page Not Found</div>
        <p class="error-desc">The requested route or file does not exist on this server. Check your syntax and try compiling again!</p>
      </div>
    </div>
    <a href="/" class="btn-home">Return to Safety ✦</a>
  </div>
</body>
</html>
